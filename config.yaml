# SGLang bench_offline_throughput auto-tune configuration
# The optimizer sweeps chunked_prefill_size and picks the max-throughput config.

model: microsoft/Phi-4-mini-instruct

workload:
  input_len: 2000
  output_len: 1000
  num_prompts: 200

sweep:
  chunked_prefill_sizes: [2048, 4096, 8192]

sglang_args:
  tp: 1
  mem_fraction_static: 0.85
  disable_radix_cache: true
  random_range_ratio: 1.0

output_dir: results
