# Default benchmark configuration for Phase 1 Validation
# Hardware: 1x RTX 4090 (24 GB VRAM)
# Model: microsoft/Phi-4-mini-instruct (~7.67 GB weights)

model: microsoft/Phi-4-mini-instruct

# Context window — must be >= input_len + output_len
# Phi-4-mini supports 131072, but we cap at 52000 to preserve VRAM for batch size
max_model_len: 52000

# Token dimensions
input_len: 50000
output_len: 2000
num_requests: 100

# Sweep parameters (Phase 1 — reduced for single RTX 4090)
# VRAM budget: ~6.4 GiB per 52k-token sequence → max ~2 concurrent at full length
chunk_sizes: [4096, 8192]
max_seqs: [4, 8, 16]
concurrencies: [1, 2, 4, 8, 16]

# Output
output_dir: results

# Frameworks to benchmark (list)
frameworks:
  - vllm
  # - sglang  # Uncomment after Step 7 (vLLM validation passes)
