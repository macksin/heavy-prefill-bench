# SGLang bench_offline_throughput auto-tune configuration
# The optimizer sweeps chunked_prefill_size and picks the max-throughput config.

model: Qwen/Qwen2.5-7B-Instruct

workload:
  input_len: 4000
  output_len: 1000

sweep:
  # Sweep batch sizes to find GPU saturation point.
  # Cannot be used together with workload.num_prompts.
  num_prompts: [50, 100, 200, 400]
  chunked_prefill_sizes: [2048, 4096, 8192, 16384, 32768]

sglang_args:
  tp: 1
  mem_fraction_static: 0.85
  disable_radix_cache: true
  random_range_ratio: 0.0
  quantization: null

hardware:
  gpu_hourly_cost_usd: 2.99
  provider_name: runpod
  instance_type: 1x H100 80GB
  region: us-ca
  pricing_timestamp_utc: "2026-04-27T00:00:00+00:00"
  pricing_source_note: "RunPod on-demand listed price"

output_dir: results
